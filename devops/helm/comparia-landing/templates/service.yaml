apiVersion: v1
kind: Service
metadata:
  name: {{ include "comparia-landing.fullname" . }}
  labels:
    {{- include "comparia-landing.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "comparia-landing.selectorLabels" . | nindent 4 }}
