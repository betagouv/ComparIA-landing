apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "comparia-landing.fullname" . }}
  labels:
    {{- include "comparia-landing.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "comparia-landing.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "comparia-landing.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "comparia-landing.serviceAccountName" . }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- range . }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      containers:
        - name: comparia-landing
          image: {{ include "comparia-landing.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
          env:
            - name: PORT
              value: "80"
            - name: PUBLIC_ARENA_URL
              value: {{ .Values.config.arenaUrl | quote }}
            {{- if .Values.config.matomoUrl }}
            - name: MATOMO_URL
              value: {{ .Values.config.matomoUrl | quote }}
            {{- end }}
            {{- if .Values.config.matomoId }}
            - name: MATOMO_ID
              value: {{ .Values.config.matomoId | quote }}
            {{- end }}
            {{- if .Values.config.gitCommit }}
            - name: PUBLIC_GIT_COMMIT
              value: {{ .Values.config.gitCommit | quote }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
